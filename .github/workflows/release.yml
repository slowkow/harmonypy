name: Build and publish wheels

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Build wheels on every push to master (but don't publish)
  push:
    branches: [master]
  # Publish to PyPI when a release tag is pushed
  release:
    types: [published]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Build source distribution
      run: pipx run build --sdist

    - uses: actions/upload-artifact@v5
      with:
        name: sdist
        path: dist/*.tar.gz

  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — native
          - os: ubuntu-latest
            cibw_archs: x86_64
          # Linux aarch64 — native ARM runner (no QEMU)
          - os: ubuntu-24.04-arm
            cibw_archs: aarch64
          # macOS x86_64 + arm64 (cross-compile x86_64 via Rosetta 2)
          - os: macos-14
            cibw_archs: "x86_64 arm64"

    steps:
    - uses: actions/checkout@v5

    - uses: pypa/cibuildwheel@v2.21
      env:
        CIBW_ARCHS: ${{ matrix.cibw_archs }}

    - uses: actions/upload-artifact@v5
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}
        path: wheelhouse/*.whl

  # Publish to PyPI only on release
  publish:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write  # for trusted publishing

    steps:
    - uses: actions/download-artifact@v5
      with:
        path: dist
        merge-multiple: true

    - name: List artifacts
      run: ls -lh dist/

    - uses: pypa/gh-action-pypi-publish@release/v1
