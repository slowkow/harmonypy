[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "harmonypy"
version = "2.0.0"
description = "A data integration algorithm."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
authors = [
    { name = "Kamil Slowikowski", email = "kslowikowski@gmail.com" },
    { name = "John Arevalo", email = "johnarevalo@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.2",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/slowkow/harmonypy"

[tool.scikit-build]
wheel.packages = ["harmonypy"]
build.verbose = true
build-dir = "/tmp/harmonypy-build/{wheel_tag}"
ninja.make-fallback = true

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
test-requires = ["pytest", "scipy"]
test-command = "cd {project} && pytest tests/test_harmony.py::test_run_harmony_small -v"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
before-all = "yum install -y openblas-devel lapack-devel || dnf install -y openblas-devel lapack-devel"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"
