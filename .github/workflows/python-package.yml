name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev

    - name: Build and install
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Test with pytest
      run: pytest tests/ -v

  asan:
    name: ASan + UBSan (Linux, Python 3.12)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev

    - name: Build with AddressSanitizer + UBSan
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]" -C cmake.define.HARMONYPY_SANITIZE=ON

    - name: Test under sanitizers
      env:
        # LeakSanitizer is on by default on Linux and would flag Python/BLAS
        # allocations that are never freed. Disable leak detection but keep
        # memory errors (heap-buffer-overflow, use-after-free, ...) fatal.
        ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        # Python is not sanitized, so the ASan runtime must be preloaded
        # (it has to come first in the load order). libstdc++ is preloaded
        # too: Python itself does not link it, so otherwise ASan's __cxa_throw
        # interceptor initializes before libstdc++ is loaded and the first C++
        # exception thrown by the extension aborts with
        # "CHECK failed: real___cxa_throw != 0".
        LIBASAN=$(gcc -print-file-name=libasan.so)
        LIBSTDCXX=$(gcc -print-file-name=libstdc++.so)
        echo "Preloading $LIBASAN:$LIBSTDCXX"
        # -s disables pytest's output capture so the sanitizer report, if any,
        # reaches the CI log instead of being swallowed on abort.
        LD_PRELOAD="$LIBASAN:$LIBSTDCXX" pytest tests/ -v -s
